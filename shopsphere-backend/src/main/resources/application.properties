spring.application.name=shopsphere-backend

spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:augustinedev0410@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.tax.rate=${TAX_RATE:0.08}

app.base-url=${APP_BASE_URL:http://localhost:8080}
